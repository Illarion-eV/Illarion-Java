buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.10.0'
        classpath 'de.undercouch:gradle-download-task:5.7.0'
    }
}

plugins {
    id 'idea'
    id 'com.github.spotbugs' version '6.5.12' apply false
}

wrapper {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c'
}

// Resolve once, independently of the branch name or remote resource availability.
def gitOutput = { List<String> args ->
    def output = providers.exec {
        commandLine(['git'] + args)
        workingDir(rootDir)
        ignoreExitValue = true
    }

    output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : 'unknown'
}

def revision = gitOutput(['describe', '--tags', '--always', 'HEAD'])
def sourceBranch = gitOutput(['rev-parse', '--abbrev-ref', 'HEAD'])
def releaseVersion = revision.tokenize('-')[0]

if (sourceBranch == 'master' && revision.contains('-')) {
    throw new GradleException('Cannot build a snapshot on master: ' + revision)
}

allprojects {
    group = 'org.illarion'
    version = sourceBranch == 'master' ? releaseVersion : releaseVersion + '-SNAPSHOT'
    ext.fullVersion = revision
    ext.branch = sourceBranch

    ext.mavenRepo = providers.gradleProperty('targetRepo').map {
        file(it).toURI().toString()
    }.getOrElse(layout.buildDirectory.dir('repo').get().asFile.toURI().toString())

    tasks.register('gitVersion') {
        description = 'Version metadata is resolved during configuration.'
    }

    repositories {
        mavenCentral()

        maven {
            url = uri('https://illarion.org/media/java/maven')

            content {
                includeGroup 'org.illarion'
                includeGroup 'org.l33tlabs.twl'
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    def targetJava = project.name == 'download' ? 25 : project.name == 'build' ? 17 :
            project.name in ['easynpc', 'compiler'] ? 11 : 8

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        sourceCompatibility = JavaVersion.toVersion(targetJava)
        targetCompatibility = JavaVersion.toVersion(targetJava)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Build utilities use Gradle's Java 17 API; the JavaFX launcher targets Java 25.
        options.release = targetJava
    }

    tasks.withType(Test).configureEach {
        useTestNG()
        // Optional compatibility check for application modules, without changing the build JVM.
        if (providers.gradleProperty('testJavaVersion').isPresent()) {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(providers.gradleProperty('testJavaVersion').get().toInteger())
            }
        }
    }

    dependencies {
        testImplementation 'org.testng:testng:7.5.1'
        api 'org.jetbrains:annotations:15.0'
        api 'com.google.code.findbugs:jsr305:3.0.1'
    }

    spotbugs {
        toolVersion = '4.10.4'
        ignoreFailures = true
        effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
    }

    pmd {
        toolVersion = '7.28.0'
        ignoreFailures = true
        ruleSetFiles = rootProject.files('pmd.xml')
        ruleSets = []
    }
}
