import proguard.gradle.ProGuardTask

apply plugin: 'java-library'
apply plugin: 'application'
apply from: '../versions.gradle'

base {
    archivesName = 'illarion_compiler'
}

application {
    mainClass = 'illarion.compile.Compiler'
}

dependencies {
    api project(':common')
    api project(':easynpc')
    api project(':easyquest')
    api "commons-cli:commons-cli:1.4"
    api "org.slf4j:slf4j-api:${project.ext.slf4jVersion}"
    api "org.slf4j:jcl-over-slf4j:${project.ext.slf4jVersion}"
    api "ch.qos.logback:logback-classic:${project.ext.logbackVersion}"
}

jar {
    dependsOn { gitVersion }
    manifest {
        attributes       \
               'Main-Class': 'illarion.compile.Compiler',       \
              'Permissions': 'all-permissions',      \
              'Codebase': 'illarion.org',      \
              'Application-Name': 'Illarion Compiler',      \
              'Application-Library-Allowable-Codebase': 'illarion.org',      \
              'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ssZ'),      \
              'Built-By': System.getProperty('user.name'),       \
              'Built-JDK': System.getProperty('java.version'),       \
              'Implementation-Title': 'Illarion Compiler',       \
              'Implementation-Vendor': 'Illarion e.V.',      \
              'Implementation-Version': project.ext.fullVersion
    }
}

tasks.register('proguard', ProGuardTask) {
    dependsOn tasks.named('jar'), configurations.runtimeClasspath

    injars tasks.named('jar', Jar).flatMap {
        it.archiveFile
    }

    configuration file('compiler.pro')
    inputs.files(configurations.runtimeClasspath)
    outputs.file(layout.buildDirectory.file('compiler.jar'))

    doFirst {
        configurations.runtimeClasspath.files.each { dependency ->
            // Retain service descriptors: XmlPullParserFactory needs META-INF/services at runtime.
            def filter = '!META-INF/MANIFEST.MF,!META-INF/*.SF,!META-INF/*.RSA,!META-INF/*.DSA,' +
                    '!META-INF/maven/**,!META-INF/versions/**,!META-INF/plexus/**,!META-INF/sisu/**,' +
                    '!about.html,!LICENSE,!OSGI-OPT/**,!**/packageinfo,!**.java,!xmlns/**'

            if (dependency.name.contains('xpp3') || dependency.name.contains('axis-jaxrpc')) {
                filter += ',!javax/xml/namespace/QName.class'
            }

            if (dependency.name.contains('illarion')) {
                filter += ',!*.png,!logback.xml,!logback-to-file.xml,!*.dat'
            }

            injars([filter: filter], dependency)
        }

        // ProGuard associates an output with the input entries preceding it.
        outjars layout.buildDirectory.file('compiler.jar')

        fileTree("${System.getProperty('java.home')}/jmods") {
            include '*.jmod'
        }.each {
            libraryjars([jarfilter: '!**.jar', filter: '!module-info.class'], it)
        }
    }
}

// Exercise the shipped, shrunk JAR rather than the unprocessed runtime classpath.
tasks.register('verifyCompiler', JavaExec) {
    dependsOn tasks.named('proguard')
    group = 'verification'
    description = 'Compile the bundled NPC template using the standalone compiler JAR.'
    classpath = files(layout.buildDirectory.file('compiler.jar'))
    mainClass = 'illarion.compile.Compiler'

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    def output = layout.buildDirectory.dir('compiler-smoke')
    def template = project(':easynpc').file('src/main/resources/template1.npc')
    def compilerLog = new ByteArrayOutputStream()
    standardOutput = compilerLog
    errorOutput = compilerLog

    doFirst {
        delete output.get().asFile
        output.get().asFile.mkdirs()
        args = ['-n', output.get().asFile.absolutePath, template.absolutePath]
    }

    doLast {
        def generated = new File(output.get().asFile, 'template1.lua')
        // The legacy compiler can log parser initialisation errors despite returning zero.
        if (!generated.isFile() || generated.length() == 0 || compilerLog.toString('UTF-8').contains('ERROR')) {
            throw new GradleException('Standalone compiler smoke test failed:\n' + compilerLog.toString('UTF-8'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCompiler')
}


if (project.hasProperty('compilerDir')) {
    task publishBundle(type: Copy, dependsOn: 'proguard') {
        from new File(project.buildDir, "compiler.jar").absolutePath
        into file(project.compilerDir)
    }
    task publish(dependsOn: "publishBundle") {}
}

build.dependsOn("proguard")
