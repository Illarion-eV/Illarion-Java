apply plugin: 'application'
apply plugin: 'maven-publish'
apply from: '../versions.gradle'

['targetDistDir', 'install4jDir', 'install4jTargetDir', 'keyFile'].each { legacyProperty ->
    if (project.hasProperty(legacyProperty)) {
        throw new GradleException("${legacyProperty} belongs to the retired JavaFX/install4j release pipeline. " +
                'See README.md: release packaging requires a separate migration.')
    }
}

base {
    archivesName = 'illarion_download'
}

application {
    mainClass = 'illarion.download.Application'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def fxPlatform = os.contains('win') ? 'win' : os.contains('mac') ? 'mac' : 'linux'

if (arch in ['aarch64', 'arm64']) {
    fxPlatform += '-aarch64'
}

dependencies {
    api project(':common')
    api "org.slf4j:slf4j-api:${project.ext.slf4jVersion}"
    api "org.slf4j:jul-to-slf4j:${project.ext.slf4jVersion}"
    api "org.slf4j:jcl-over-slf4j:${project.ext.slf4jVersion}"
    api "org.slf4j:log4j-over-slf4j:${project.ext.slf4jVersion}"
    api "ch.qos.logback:logback-classic:${project.ext.logbackVersion}"
    api "org.ogce:xpp3:1.1.6"
    api "org.bushe:eventbus:1.4"
    api "com.google.guava:guava:21.0"
    api "org.eclipse.aether:aether-api:1.1.0"
    api "org.eclipse.aether:aether-connector-basic:1.1.0"
    api "org.eclipse.aether:aether-transport-http:1.1.0"
    api "org.apache.maven:maven-aether-provider:3.3.9"
}

dependencies {
    ['base', 'graphics', 'controls', 'fxml'].each { module ->
        implementation("org.openjfx:javafx-${module}:25.0.4:${fxPlatform}") {
            transitive = false
        }
    }
}

jar {
    dependsOn { gitVersion }
    manifest {
        attributes \
                 'Main-Class': 'illarion.download.Application', \
                 'JavaFX-Feature-Proxy': 'None', \
                 'Permissions': 'all-permissions', \
                 'Codebase': 'illarion.org', \
                 'Application-Name': 'Illarion Launcher', \
                 'Application-Library-Allowable-Codebase': 'illarion.org', \
                 'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ssZ'), \
                 'Built-By': System.getProperty('user.name'), \
                 'Built-JDK': System.getProperty('java.version'), \
                 'Implementation-Title': 'Illarion Launcher', \
                 'Implementation-Vendor': 'Illarion e.V.',\
                  'Implementation-Version': project.ext.fullVersion
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(project.ext.mavenRepo)
        }
    }
}
